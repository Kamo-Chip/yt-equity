<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YT Equity</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="popup-container">
      <header class="brand">
        <span class="brand-mark" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="m8 5 11 7-11 7Z"/></svg></span>
        <h1>YT Equity</h1>
        <a class="support-link" aria-haspopup="dialog" aria-controls="support-dialog" href="https://www.youtube.com/watch?v=WNGNhItoRh8#yt-equity-thanks" target="_blank" rel="noreferrer" aria-label="Leave a tip" title="Leave a tip"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8h1a3 3 0 1 1 0 6h-1M3 8h15v9a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3ZM6 2v2M10 2v2M14 2v2"/></svg></a>
      </header>

      <section class="settings" aria-label="Feed filter">
        <fieldset class="setting-group">
          <legend>Hide channels</legend>
          <div class="setting-row">
            <label class="setting-label" for="hide-acquisitions">Acquired channels</label>
            <button id="filter-info" class="info-button" type="button" aria-label="About hiding channels" aria-expanded="false" aria-controls="filter-help">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><circle cx="12" cy="7.5" r=".8" fill="currentColor" stroke="none"/></svg>
            </button>
            <div class="switch">
              <input id="hide-acquisitions" data-setting="hideConfirmedAcquisitions" type="checkbox" role="switch" disabled />
              <span class="switch-track" aria-hidden="true"><span></span></span>
            </div>
          </div>
          <div class="setting-row">
            <label class="setting-label" for="hide-funding">Funded channels</label>
            <div class="switch">
              <input id="hide-funding" data-setting="hideConfirmedFunding" type="checkbox" role="switch" disabled />
              <span class="switch-track" aria-hidden="true"><span></span></span>
            </div>
          </div>
        </fieldset>
        <fieldset class="setting-group">
          <legend>Where to hide</legend>
          <div class="setting-row">
            <label class="setting-label" for="filter-home">Home</label>
            <div class="switch">
              <input id="filter-home" data-setting="filterHome" type="checkbox" role="switch" disabled />
              <span class="switch-track" aria-hidden="true"><span></span></span>
            </div>
          </div>
          <div class="setting-row">
            <label class="setting-label" for="filter-search">Search results</label>
            <div class="switch">
              <input id="filter-search" data-setting="filterSearch" type="checkbox" role="switch" disabled />
              <span class="switch-track" aria-hidden="true"><span></span></span>
            </div>
          </div>
          <div class="setting-row">
            <label class="setting-label" for="filter-suggested">Suggested videos</label>
            <div class="switch">
              <input id="filter-suggested" data-setting="filterSuggested" type="checkbox" role="switch" disabled />
              <span class="switch-track" aria-hidden="true"><span></span></span>
            </div>
          </div>
          <div class="setting-row">
            <label class="setting-label" for="filter-subscriptions">Subscriptions</label>
            <div class="switch">
              <input id="filter-subscriptions" data-setting="filterSubscriptions" type="checkbox" role="switch" disabled />
              <span class="switch-track" aria-hidden="true"><span></span></span>
            </div>
          </div>
        </fieldset>
        <p id="filter-help" class="setting-help" hidden>Only confirmed records are hidden. Reveal individual videos on YouTube.</p>
        <p id="setting-error" class="setting-error" role="status" aria-live="polite" aria-atomic="true"></p>
      </section>

      <nav class="popup-actions" aria-label="Support and website">
        <a href="__WEB_URL__/report" target="_blank" rel="noreferrer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V3c5-3 9 3 14 0v11c-5 3-9-3-14 0"/></svg>Report</a>
        <a class="action-primary" href="__WEB_URL__/" target="_blank" rel="noreferrer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3h7v7M21 3 10 14M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/></svg>Website</a>
      </nav>
      <footer class="popup-footer"><a href="__WEB_URL__/privacy" target="_blank" rel="noreferrer">Privacy policy</a></footer>
    </main>
    <dialog id="support-dialog" class="support-dialog" aria-labelledby="support-title" aria-describedby="support-description">
      <h2 id="support-title">Leave a tip</h2>
      <p id="support-description">Leave a tip with YouTube Super Thanks. This will open a YouTube video in a new tab, where you enter the amount to tip.</p>
      <p id="support-error" class="setting-error" role="status" aria-live="polite" aria-atomic="true"></p>
      <div class="support-dialog-actions">
        <button id="support-cancel" type="button" autofocus>Cancel</button>
        <button id="support-continue" class="support-continue" type="button">Continue</button>
      </div>
    </dialog>
    <script src="popup.js"></script>
  </body>
</html>
